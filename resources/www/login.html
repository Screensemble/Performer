<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screensemble — unlock</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    color-scheme: dark;
    --navy: #0a1428; --card: #10203c; --edge: #1d3a63;
    --cyan: #3ec1f3; --text: #dde6f2; --dim: #7a9bb8; --err: #e8694a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background:
         radial-gradient(ellipse 70% 55% at 50% 20%, rgba(62,193,243,.10), transparent 70%),
         #000; color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  .card { width: min(340px, 92vw); background: var(--card);
          border: 1px solid var(--edge); border-radius: 14px;
          padding: 30px 28px 24px; box-shadow: 0 24px 70px rgba(0,0,0,.55); }
  .brand { display: flex; flex-direction: column; align-items: center;
           gap: 8px; margin-bottom: 22px; }
  .brand img.mark { height: 52px; }
  .brand img.wordmark { height: 14px; }
  label { display: block; font-size: 12px; font-weight: 600;
          letter-spacing: .06em; text-transform: uppercase;
          color: var(--dim); margin: 12px 0 6px; }
  input { width: 100%; background: var(--navy); border: 1px solid var(--edge);
          border-radius: 8px; color: var(--text); font: 15px system-ui;
          padding: 11px 13px; outline: none; }
  input:focus { border-color: var(--cyan); }
  button { width: 100%; margin-top: 18px; background: var(--cyan);
           color: #06121d; border: 0; border-radius: 8px; padding: 11px;
           font: 700 15px system-ui; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--err); font-size: 13px; min-height: 18px;
         margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img class="mark" src="/logo.png" alt="Screensemble">
    <img class="wordmark" src="/wordmark.png" alt="Screensemble">
  </div>
  <form id="f">
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required autofocus>
    <button id="btn" type="submit">Unlock</button>
  </form>
  <div class="err" id="err"></div>
</div>
<script>
const err = m => document.getElementById('err').textContent = m || '';
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true; err('');
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('p').value }),
    });
    if (r.ok) { location.href = '/'; return; }
    err('Incorrect password');
  } catch {
    err('Could not reach the display');
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
