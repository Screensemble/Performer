<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screensemble Setup</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --navy: #0a1428; --card: #10203c; --edge: #1d3a63;
    --cyan: #3ec1f3; --text: #dde3e8; --dim: #7a9bb8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #000; color: var(--text);
    font: 16px/1.5 system-ui, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .card {
    background: var(--card); border-top: 4px solid var(--cyan);
    border-radius: 10px; padding: 24px; width: 100%; max-width: 480px;
  }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .head img { height: 34px; }
  .step { color: var(--cyan); font-size: 13px; letter-spacing: 1px; margin: 8px 0 4px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.dim { color: var(--dim); font-size: 14px; margin: 0 0 18px; }
  .opt, button {
    display: block; width: 100%; text-align: left; margin: 0 0 10px;
    padding: 14px 16px; font-size: 16px; color: var(--text);
    background: var(--edge); border: 0; border-radius: 8px; cursor: pointer;
  }
  .opt:hover, button:hover { background: #24507f; }
  button.primary {
    text-align: center; font-weight: 600;
    background: linear-gradient(90deg, #1e9be8, #3ec1f3); color: #06101f;
  }
  button.primary:hover { filter: brightness(1.1); }
  label { display: block; font-size: 13px; color: var(--dim); margin: 14px 0 4px; }
  input[type=text], input[type=number], input[type=password] {
    width: 100%; padding: 12px; font-size: 16px; color: var(--text);
    background: #000; border: 1px solid var(--edge); border-radius: 6px;
  }
  .chk { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 14px; }
  .chk input { width: 20px; height: 20px; accent-color: var(--cyan); }
  .hint { font-size: 12px; color: #556570; margin-top: 4px; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .row button { margin: 0; }
  .err { color: #e8694a; font-size: 14px; margin-top: 10px; min-height: 20px; }
  .big { font-size: 40px; letter-spacing: 6px; color: var(--cyan); text-align: center; margin: 12px 0; }
  button.browse { width: auto; display: inline-block; padding: 8px 14px;
                  font-size: 13px; margin: 8px 0 0; }
  .picker { margin-top: 10px; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
  .picker .crumb { padding: 10px 12px; font-size: 12px; color: var(--cyan);
                   background: #000; word-break: break-all; }
  .picker .list { max-height: 220px; overflow-y: auto; }
  .picker .entry { padding: 11px 12px; font-size: 14px; border-top: 1px solid var(--edge);
                   cursor: pointer; }
  .picker .entry:hover { background: var(--edge); }
  .picker .entry.up { color: var(--dim); }
  .picker .prow { display: flex; }
  .picker .prow button { margin: 0; border-radius: 0; font-size: 13px; padding: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <img src="/logo.png" alt="">
    <img src="/wordmark.png" alt="Screensemble" style="height:22px">
  </div>
  <div class="step" id="step"></div>
  <h1 id="title"></h1>
  <p class="dim" id="desc"></p>
  <div id="body"></div>
  <div class="err" id="err"></div>
</div>
<script>
const K = new URLSearchParams(location.search).get("k") || "";
const api = p => p + (p.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(K);
const $ = id => document.getElementById(id);

let state = { player_mode: 0 };

// Heartbeat: while this page is open the TV wizard shows "setup in progress".
setInterval(() => fetch(api("/api/setup/ping")).catch(() => {}), 2000);
fetch(api("/api/setup/ping")).catch(() => {});

fetch(api("/api/setup/state")).then(r => r.json()).then(d => {
  if (d.settings) state = d.settings;
}).catch(() => {});

const steps = [
  {
    title: "How should this display run?",
    desc: "Local plays media from a folder on this display — no network needed. Server connects to a Screensemble server for managed, synchronized content.",
    render() {
      $("body").innerHTML =
        `<button class="opt" onclick="pick(0)">Local (standalone)</button>` +
        `<button class="opt" onclick="pick(1)">Server (managed / controlled)</button>`;
    },
  },
  {
    title: "Display details",
    render() {
      const s = state;
      let h = "";
      if (s.player_mode === 0) {
        h +=
          `<div class="hint">Plays the display's built-in media folder — ` +
          `upload files from the admin page afterward, or set a custom ` +
          `folder in the addon's Advanced settings. Per-item image ` +
          `durations are set on the playlist (10s default).</div>`;
      } else {
        h +=
          `<label>Server address</label>` +
          `<input type="text" id="server_address" value="${esc(s.server_address)}" placeholder="server:8080">` +
          `<label>Auth token (if the server requires one)</label>` +
          `<input type="password" id="server_auth_token" value="${esc(s.server_auth_token)}">` +
          `<label>Device name</label>` +
          `<input type="text" id="device_name" value="${esc(s.device_name)}" placeholder="Gallery Wall 1">` +
          `<label>Cache folder (on the display)</label>` +
          `<input type="text" id="server_media_dir" value="${esc(s.server_media_dir)}" placeholder="optional">` +
          `<button class="browse" onclick="browseFor('server_media_dir')">Browse folders…</button>` +
          `<div id="picker"></div>` +
          `<div class="hint">Downloaded content lives here and survives outages.</div>` +
          `<button class="browse" onclick="pairNow()">Send pairing request to this server</button>` +
          `<div class="hint">The display asks you to confirm on its remote — pairing also registers it on the server's dashboard.</div>`;
      }
      h +=
        `<div class="row">` +
        `<button onclick="back()">Back</button>` +
        `<button class="primary" onclick="finish()">Finish setup</button>` +
        `</div>`;
      $("body").innerHTML = h;
    },
  },
  {
    title: "Done",
    render() {
      $("body").innerHTML =
        `<p class="dim">Settings saved — the display takes it from here.` +
        ` You can close this page.</p>` +
        `<div class="row"><button class="primary" onclick="location='/'">Open admin page</button></div>`;
    },
  },
];

let step = 0;
function esc(v) { return String(v || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function show() {
  const s = steps[step];
  $("step").textContent = `STEP ${step + 1} OF ${steps.length}`;
  $("title").textContent = s.title;
  $("desc").textContent = s.desc || "";
  $("err").textContent = "";
  s.render();
}
function pick(m) { state.player_mode = m; step = 1; show(); }
function back() { step = 0; show(); }

// Folder picker — browses the display's filesystem through Kodi's
// Files.GetSources/GetDirectory via /api/browse.
let browseTarget = null, browsePath = "", browseStack = [], browseEntries = [];

function pairNow() {
  const s = v("server_address").trim();
  if (!s) { $("err").textContent = "Enter the server address first."; return; }
  // Same endpoint pair.html uses — the token K came in with this page's
  // URL, so no camera hop is needed.
  window.open(`/pair?s=${encodeURIComponent(s)}&a=${encodeURIComponent(v("server_auth_token"))}&t=${encodeURIComponent(K)}`, "_blank");
  $("err").textContent = "";
}

async function browseFor(inputId) {
  browseTarget = inputId;
  browseStack = [];
  await browseInto("");
}
async function browseInto(path) {
  $("picker").innerHTML = `<div class="picker"><div class="crumb">Loading…</div></div>`;
  try {
    const d = await fetch(api("/api/browse?path=" + encodeURIComponent(path)))
      .then(r => r.json());
    browsePath = d.path || path;
    browseEntries = d.entries || [];
    renderPicker(d.error);
  } catch (e) {
    $("picker").innerHTML = "";
    $("err").textContent = "Folder browse failed — you can still type a path.";
  }
}
function browseDown(i) {
  browseStack.push(browsePath);
  browseInto(browseEntries[i].path);
}
function browseUp() { browseInto(browseStack.pop() || ""); }
function pickBrowse() {
  if (browseTarget && browsePath) $(browseTarget).value = browsePath;
  closePicker();
}
function closePicker() {
  $("picker").innerHTML = "";
  browseTarget = null;
}
function renderPicker(error) {
  let h = `<div class="crumb">${esc(browsePath || "Media sources")}</div><div class="list">`;
  if (browseStack.length) h += `<div class="entry up" onclick="browseUp()">⬅ Back</div>`;
  if (error) h += `<div class="entry" style="color:#e8694a">${esc(error)}</div>`;
  if (!browseEntries.length && !error) h += `<div class="entry">(no subfolders)</div>`;
  h += browseEntries.map((e, i) =>
    `<div class="entry" onclick="browseDown(${i})">📁 ${esc(e.name)}</div>`).join("");
  h += `</div><div class="prow"><button onclick="closePicker()">Cancel</button>`;
  if (browsePath) h += `<button class="primary" onclick="pickBrowse()">Use this folder</button>`;
  h += `</div>`;
  $("picker").innerHTML = `<div class="picker">${h}</div>`;
}
function collect() {
  const v = id => { const el = $(id); return el ? el.value : undefined; };
  if (state.player_mode === 0) {
  } else {
    state.server_address = v("server_address");
    state.server_auth_token = v("server_auth_token");
    state.device_name = v("device_name");
    state.server_media_dir = v("server_media_dir");
  }
}
async function finish() {
  collect();
  if (state.player_mode === 1 && !state.server_address) {
    $("err").textContent = "Enter the server address."; return;
  }
  state.setup_complete = true;
  try {
    const r = await fetch(api("/api/setup"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state),
    });
    if (!r.ok) throw new Error(await r.text());
    step = 2; show();
  } catch (e) {
    $("err").textContent = "Save failed — is the display still reachable?";
  }
}
show();
</script>
</body>
</html>
